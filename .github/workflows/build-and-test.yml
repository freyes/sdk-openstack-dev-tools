name: Build and test

on:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: canonical/setup-lxd@main
        with:
          group: lxd

      - name: Add user to lxd group
        run: |
          sudo usermod -aG lxd $USER

      - name: Verify LXD access
        run: |
          sg lxd -c 'lxc version'
          # KVM is required because the spread tests use vm:true
          ls -l /dev/kvm || true

      - name: Install sdkcraft
        run: sudo snap install sdkcraft --classic

      - name: Pack SDK
        run: sg lxd -c 'sdkcraft pack -v'

      - name: Test SDK
        run: sg lxd -c 'sdkcraft test -v'
